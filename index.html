<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Radar Cripto</title>
<style>
  :root {
    --mist: #D9DED9;
    --gull: #F6F7F4;
    --harbor: #1F3B33;
    --ink: #14201C;
    --rust: #A4502E;
    --line: rgba(31, 59, 51, 0.18);
    --font: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--mist);
    color: var(--ink);
    font-family: var(--sans);
    line-height: 1.6;
  }
  main { max-width: 760px; margin: 0 auto; padding: 48px 20px 64px; }
  h1 { font-family: var(--font); font-weight: 500; font-size: clamp(40px, 7vw, 64px); line-height: 1.05; margin: 0 0 8px; color: var(--harbor); letter-spacing: -0.02em; }
  .lede { margin: 0 0 32px; }
  .context { display: flex; align-items: center; gap: 10px; padding: 14px 16px; background: var(--gull); border-radius: 12px; font-size: 15px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; background: var(--harbor); }
  .dot.off { background: var(--rust); }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; margin: 24px 0 0; }
  .status { font-size: 14px; opacity: 0.85; font-variant-numeric: tabular-nums; }
  .status.error { color: var(--rust); opacity: 1; }
  label.auto { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; }
  button.primary {
    font: inherit; font-size: 15px; font-weight: 500;
    color: var(--gull); background: var(--harbor);
    border: 0; border-radius: 10px; padding: 10px 18px; cursor: pointer;
  }
  button.primary:hover { background: #2a4d43; }
  button.primary:disabled { opacity: 0.6; cursor: progress; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--harbor); outline-offset: 2px; }
  .velas { display: block; width: 100%; height: 120px; margin: 32px 0 8px; }
  .section-title { font-size: 14px; font-weight: 500; margin: 32px 0 4px; color: var(--harbor); }
  .row { border-top: 0.5px solid var(--line); padding: 20px 0; }
  .row:last-child { border-bottom: 0.5px solid var(--line); }
  .row-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 12px; }
  .symbol { font-family: var(--font); font-size: 28px; font-weight: 500; color: var(--harbor); margin: 0; text-decoration: none; border-bottom: 0.5px solid transparent; }
  a.symbol:hover { border-bottom-color: var(--harbor); }
  a.symbol:focus-visible { outline: 2px solid var(--harbor); outline-offset: 4px; }
  .levels { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px 24px; margin: 16px 0 0; }
  .levels dt { font-size: 13px; opacity: 0.75; }
  .levels dd { margin: 2px 0 0; font-size: 17px; font-variant-numeric: tabular-nums; }
  .stop dd { color: var(--rust); }
  .vol-note { margin: 14px 0 0; font-size: 14px; opacity: 0.85; }
  .vol-note.warn { color: var(--rust); opacity: 1; }
  button.toggle {
    font: inherit; font-size: 14px; color: var(--harbor);
    background: transparent; border: 0.5px solid var(--line); border-radius: 8px;
    padding: 6px 12px; cursor: pointer;
  }
  button.toggle:hover { background: var(--gull); }
  .checks { list-style: none; padding: 0; margin: 16px 0 0; display: none; }
  .checks.open { display: block; }
  .checks li { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-top: 0.5px solid var(--line); font-size: 15px; }
  .checks li span:last-child { color: var(--harbor); white-space: nowrap; }
  .checks li.fail span:last-child { color: var(--rust); }
  .empty { padding: 24px 0; font-size: 16px; }
  .footer { margin-top: 48px; font-size: 13px; opacity: 0.8; }
  select { font: inherit; font-size: 14px; color: var(--ink); background: var(--gull); border: 0.5px solid var(--line); border-radius: 8px; padding: 6px 10px; margin-left: 8px; }
  select:focus-visible { outline: 2px solid var(--harbor); outline-offset: 2px; }
  .checks li.off span:last-child { color: var(--ink); opacity: 0.6; }
  .bt-row { display: grid; grid-template-columns: 2fr repeat(4, minmax(0, 1fr)); gap: 8px; padding: 10px 0; border-top: 0.5px solid var(--line); font-size: 14px; font-variant-numeric: tabular-nums; }
  .bt-row:last-child { border-bottom: 0.5px solid var(--line); }
  .bt-name { font-weight: 500; color: var(--harbor); }
  .bt-head { font-size: 13px; font-weight: 500; color: var(--harbor); border-top: 0; padding-bottom: 6px; }
</style>
</head>
<body>
<main>
  <h1>Radar Cripto</h1>
  <p class="lede">Contratos perpetuos USDT de Binance con RSI de 4 horas en sobreventa: vigilancia y posibles entradas long.</p>

  <section class="context" aria-live="polite">
    <span class="dot" id="btc-dot"></span>
    <span id="btc-text">Conectando con Binance…</span>
  </section>
  <p class="meta" id="meta"></p>

  <div class="controls">
    <button class="primary" id="scan-btn" type="button">Actualizar ahora</button>
    <label class="auto">
      <input type="checkbox" id="auto" checked>
      Actualizar cada 5 minutos
    </label>
    <span class="status" id="status" role="status"></span>
  </div>

  <canvas class="velas" aria-hidden="true"></canvas>

  <h2 class="section-title" id="count"></h2>
  <div id="longs"></div>

  <h2 class="section-title" id="watch-title"></h2>
  <div id="watch"></div>

  <p class="footer">No es una recomendación de inversión. Los futuros con apalancamiento pueden liquidar la posición. Verifica cada señal antes de operar.</p>
</main>

<script>
// --- Configuración ---
const BASE = "https://fapi.binance.com";
const INTERVAL = "4h";
const KLINE_LIMIT = 250;
const DAILY_LIMIT = 500;     // historial diario suficiente para que la EMA 200 converja
const DAILY_MIN = 400;       // mínimo de velas diarias para confiar en la EMA 200
const CONCURRENCY = 6;
const AUTO_REFRESH_MS = 5 * 60 * 1000;

const P = {
  btcFast: 50, btcSlow: 200,
  emaFast: 20, emaSlow: 50,
  slopeLookback: 5,
  pullback: 3,
  rsiLen: 14, rsiMin: 40, rsiMax: 70,
  volLen: 20,
  swing: 5,
  atrLen: 14, atrMult: 1.0,
  targetR: 2.0,
  volLow: 5000000,            // volumen 24 h (USDT) por debajo: nivel bajo
  volHigh: 50000000,          // volumen 24 h (USDT) desde aquí: nivel alto
  riskPct: 1.0,               // riesgo por operación (% del capital)
  lowVolRiskPct: 0.5,         // riesgo reducido cuando el volumen es bajo
  maxStopPct: 0.08,          // distancia máxima entrada-stop
  maxExtension: 0.05,        // máximo sobre la EMA 20 de 4h
  maxRise7d: 0.50,           // subida máxima en 7 días (42 velas de 4h)
  rsiOversold: 35,           // nivel de sobreventa del RSI
  dailyEma: 200,             // EMA diaria del propio activo
};

const LABELS = {
  contexto_btc: "Contexto de BTC alcista",
  precio_sobre_ema50: "Precio sobre EMA 50",
  ema20_sobre_ema50: "EMA 20 sobre EMA 50",
  ema50_pendiente_positiva: "EMA 50 con pendiente positiva",
  retroceso_a_ema: "Retroceso a la EMA con cierre por encima",
  sin_cierre_bajo_ema50: "Sin cierres bajo EMA 50 recientes",
  rsi_en_rango: "RSI dentro del rango",
  volumen_sobre_media: "Volumen sobre su media",
  minimo_mas_alto: "Mínimo más alto",
  ema200_diaria_activo: "Precio sobre EMA 200 diaria del activo",
  no_sobreextendido: "No sobreextendido sobre la EMA 20",
  subida_7d_limitada: "Subida de 7 días dentro del límite",
  distancia_stop_razonable: "Stop a distancia razonable",
  rsi_sobreventa_previa: "RSI en sobreventa en las últimas 10 velas",
  rsi_gira_arriba: "RSI girando hacia arriba",
  cierre_confirmacion_rebote: "Cierre por encima del máximo anterior",
  cambio_tendencia_diaria: "Cambio de tendencia diaria confirmado",
  rsi_sobreventa_4h: "RSI de 4 h en sobreventa (menor o igual a 35)",
};

// Conjunto único: RSI de 4 horas (sobreventa y giro hacia arriba)
const RSI_SET = ["rsi_sobreventa_4h", "rsi_gira_arriba"];
let currentActive = RSI_SET;

// --- API pública de Binance (sin API key) ---
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

async function apiGet(path, params = {}, retries = 2) {
  const url = new URL(BASE + path);
  for (const [k, v] of Object.entries(params)) url.searchParams.set(k, v);
  for (let attempt = 0; ; attempt++) {
    const r = await fetch(url);
    if (r.ok) return r.json();
    if ((r.status === 418 || r.status === 429) && attempt < retries) {
      await sleep(30000 * (attempt + 1)); // límite de peso excedido
      continue;
    }
    throw new Error(`HTTP ${r.status}`);
  }
}

async function getSymbols() {
  const info = await apiGet("/fapi/v1/exchangeInfo");
  return info.symbols
    .filter((s) => s.contractType === "PERPETUAL" && s.quoteAsset === "USDT" && s.status === "TRADING")
    .map((s) => s.symbol);
}

async function getCandles(symbol, interval, limit) {
  const raw = await apiGet("/fapi/v1/klines", { symbol, interval, limit });
  const now = Date.now();
  // Cada vela: [openTime, open, high, low, close, volume, closeTime, ...]. Descartamos la que sigue abierta.
  return raw
    .filter((k) => Number(k[6]) < now)
    .map((k) => ({ open: +k[1], high: +k[2], low: +k[3], close: +k[4], volume: +k[5] }));
}

// --- Indicadores (mismas fórmulas que signals.py) ---
function smooth(arr, alpha) {
  const out = new Array(arr.length);
  out[0] = arr[0];
  for (let i = 1; i < arr.length; i++) out[i] = alpha * arr[i] + (1 - alpha) * out[i - 1];
  return out;
}
const ema = (arr, n) => smooth(arr, 2 / (n + 1));
const wilder = (arr, n) => smooth(arr, 1 / n);

function rsi(closes, n) {
  const up = [0], down = [0];
  for (let i = 1; i < closes.length; i++) {
    const d = closes[i] - closes[i - 1];
    up.push(Math.max(d, 0));
    down.push(Math.max(-d, 0));
  }
  const u = wilder(up, n), dn = wilder(down, n);
  return u.map((x, i) => (dn[i] === 0 ? 100 : 100 - 100 / (1 + x / dn[i])));
}

function atr(candles, n) {
  const tr = candles.map((c, i) => {
    if (i === 0) return c.high - c.low;
    const pc = candles[i - 1].close;
    return Math.max(c.high - c.low, Math.abs(c.high - pc), Math.abs(c.low - pc));
  });
  return wilder(tr, n);
}

function smaAt(arr, n, end) {
  const s = arr.slice(end - n + 1, end + 1);
  return s.reduce((a, b) => a + b, 0) / s.length;
}

// --- Criterios ---
function btcBullish(candles) {
  const c = candles.map((k) => k.close);
  const i = c.length - 1;
  const fast = ema(c, P.btcFast), slow = ema(c, P.btcSlow);
  return c[i] > slow[i] && fast[i] > slow[i];
}

function evaluateLong(candles, btcOk, dailyOk, active = RSI_SET, dailyTrend = false) {
  const c = candles.map((k) => k.close);
  const l = candles.map((k) => k.low);
  const v = candles.map((k) => k.volume);
  const i = c.length - 1;

  const e20 = ema(c, P.emaFast), e50 = ema(c, P.emaSlow);
  const r = rsi(c, P.rsiLen), a = atr(candles, P.atrLen);
  const s = P.swing, pb = P.pullback;

  const recentLow = Math.min(...l.slice(i - s + 1, i + 1));
  const priorLow = Math.min(...l.slice(i - 2 * s + 1, i - s + 1));
  const touched = l[i] <= e20[i] || l[i] <= e50[i];

  let noCloseBelow = true;
  for (let j = i - pb + 1; j <= i; j++) if (c[j] <= e50[j]) noCloseBelow = false;

  const checks = {
    contexto_btc: btcOk,
    precio_sobre_ema50: c[i] > e50[i],
    ema20_sobre_ema50: e20[i] > e50[i],
    ema50_pendiente_positiva: e50[i] > e50[i - P.slopeLookback],
    retroceso_a_ema: touched && c[i] > e20[i],
    sin_cierre_bajo_ema50: noCloseBelow,
    rsi_en_rango: r[i] >= P.rsiMin && r[i] <= P.rsiMax,
    volumen_sobre_media: v[i] > smaAt(v, P.volLen, i),
    minimo_mas_alto: recentLow > priorLow,
  };

  const entry = c[i];
  const stop = recentLow - P.atrMult * a[i];
  const risk = entry - stop;
  const validRisk = risk > 0;
  const hi = candles.map((k) => k.high);
  checks.rsi_sobreventa_previa = Math.min(...r.slice(i - 10, i)) <= P.rsiOversold;
  checks.rsi_gira_arriba = r[i] > r[i - 1];
  checks.cierre_confirmacion_rebote = c[i] > hi[i - 1];
  checks.rsi_sobreventa_4h = r[i] <= P.rsiOversold;
  checks.ema200_diaria_activo = dailyOk;
  checks.cambio_tendencia_diaria = dailyTrend;
  checks.no_sobreextendido = (c[i] - e20[i]) / e20[i] <= P.maxExtension;
  checks.subida_7d_limitada = c[i] / c[i - 42] - 1 <= P.maxRise7d;
  checks.distancia_stop_razonable = validRisk && risk / entry <= P.maxStopPct;
  const allPass = active.every((k) => checks[k]);

  return {
    signal: allPass && validRisk,
    checks,
    entry,
    stop,
    target: validRisk ? entry + P.targetR * risk : null,
    rr: validRisk ? P.targetR : null,
    rsi: r[i],
  };
}

function dailyEmaInfo(daily) {
  const c = daily.map((k) => k.close);
  const last = c.length - 1;
  const e200 = ema(c, P.dailyEma);
  const e50 = ema(c, 50);
  const emaValue = e200[last];
  const enough = daily.length >= DAILY_MIN;
  return {
    ema: emaValue,
    close: c[last],
    ok: enough && c[last] > emaValue,
    // Cambio de tendencia: precio sobre EMA 200, EMA 50 sobre EMA 200 y EMA 200 subiendo (10 días)
    trend: enough && c[last] > emaValue && e50[last] > emaValue && emaValue > e200[last - 10],
  };
}

function volumeTier(v) {
  if (v < P.volLow) return "bajo";
  if (v < P.volHigh) return "medio";
  return "alto";
}

async function scan(onProgress) {
  const btcOk = btcBullish(await getCandles("BTCUSDT", "1d", DAILY_LIMIT));
  const [info, tickers] = await Promise.all([
    apiGet("/fapi/v1/exchangeInfo"),
    apiGet("/fapi/v1/ticker/24hr"),
  ]);
  const volume = new Map(tickers.map((t) => [t.symbol, Number(t.quoteVolume)]));
  const symbols = info.symbols
    .filter((s) => s.contractType === "PERPETUAL" && s.quoteAsset === "USDT" && s.status === "TRADING")
    .map((s) => s.symbol);

  const entries = [], watch = [], errors = [];
  let evaluated = 0, done = 0, next = 0;

  async function worker() {
    while (next < symbols.length) {
      const symbol = symbols[next++];
      try {
        const candles = await getCandles(symbol, INTERVAL, KLINE_LIMIT);
        if (candles.length >= 210) {
          const res = evaluateLong(candles, btcOk, true, [], true);
          evaluated++;
          if (res.checks.rsi_sobreventa_4h) {
            const v = volume.get(symbol) || 0;
            const tier = volumeTier(v);
            const item = {
              symbol, ...res,
              volume24h: v,
              volTier: tier,
              riskPct: tier === "bajo" ? P.lowVolRiskPct : P.riskPct,
            };
            if (res.checks.rsi_gira_arriba && res.target != null) entries.push(item);
            else watch.push(item);
          }
        }
      } catch (err) {
        errors.push({ symbol, error: err.message });
      }
      done++;
      if (onProgress) onProgress(done, symbols.length, symbol);
    }
  }

  await Promise.all(Array.from({ length: CONCURRENCY }, worker));
  entries.sort((x, y) => x.rsi - y.rsi);
  watch.sort((x, y) => x.rsi - y.rsi);
  return { generatedAt: new Date(), btcOk, evaluated, total: symbols.length, longs: entries, watch, errors };
}

// --- UI ---
function renderWatch(items) {
  const box = document.getElementById("watch");
  box.replaceChildren();
  document.getElementById("watch-title").textContent =
    items.length ? `En vigilancia: ${items.length} con RSI en sobreventa, sin giro` : "En vigilancia: ninguno";
  if (items.length === 0) return;

  box.append(el("div", { className: "bt-row bt-head" }, [
    el("span", { textContent: "Activo" }),
    el("span", { textContent: "RSI 4 h" }),
    el("span", { textContent: "Precio" }),
    el("span", { textContent: "Volumen 24 h (M USD)" }),
  ]));

  for (const item of items) {
    const millions = (item.volume24h / 1e6).toLocaleString("es", { maximumFractionDigits: 1 });
    box.append(el("div", { className: "bt-row" }, [
      el("span", { className: "bt-name", textContent: item.symbol }),
      el("span", { textContent: item.rsi.toFixed(2).replace(".", ",") }),
      el("span", { textContent: fmt(item.entry) }),
      el("span", { textContent: millions }),
    ]));
  }
}

const fmt = (n) => (n == null ? "—" : Number(n).toLocaleString("es", { maximumFractionDigits: 8 }));

function el(tag, props = {}, children = []) {
  const node = document.createElement(tag);
  Object.assign(node, props);
  for (const c of children) node.append(c);
  return node;
}

function render(result) {
  const btcOk = result.btcOk;
  document.getElementById("btc-dot").classList.toggle("off", !btcOk);
  document.getElementById("btc-text").textContent = btcOk
    ? "BTC en contexto alcista: precio sobre EMA 200 diaria."
    : "BTC no está en contexto alcista. Los longs en altcoins tienen menos respaldo.";

  document.getElementById("meta").textContent =
    `Última actualización: ${result.generatedAt.toLocaleString("es")}. Velas de 4 horas cerradas.`;

  const longs = result.longs;
  document.getElementById("count").textContent =
    longs.length === 0 ? "Sin posibles entradas" : `${longs.length} posibles entradas long`;

  const container = document.getElementById("longs");
  container.replaceChildren();
  renderWatch(result.watch);

  if (longs.length === 0) {
    container.append(el("p", { className: "empty", textContent: "Ningún activo tiene RSI en sobreventa girando hacia arriba en esta vela de 4 horas." }));
    return;
  }

  for (const item of longs) {
    const checksList = el("ul", { className: "checks", id: `checks-${item.symbol}` });
    for (const key of currentActive) {
      const ok = item.checks[key];
      checksList.append(el("li", { className: ok ? "" : "fail" }, [
        el("span", { textContent: LABELS[key] || key }),
        el("span", { textContent: ok ? "cumple" : "no cumple" }),
      ]));
    }

    const button = el("button", { className: "toggle", textContent: "Ver criterios", type: "button" });
    button.setAttribute("aria-expanded", "false");
    button.setAttribute("aria-controls", checksList.id);
    button.addEventListener("click", () => {
      const open = checksList.classList.toggle("open");
      button.textContent = open ? "Ocultar criterios" : "Ver criterios";
      button.setAttribute("aria-expanded", String(open));
    });

    const levels = el("dl", { className: "levels" }, [
      el("div", {}, [el("dt", { textContent: "Entrada" }), el("dd", { textContent: fmt(item.entry) })]),
      el("div", { className: "stop" }, [el("dt", { textContent: "Stop" }), el("dd", { textContent: fmt(item.stop) })]),
      el("div", {}, [el("dt", { textContent: "Objetivo" }), el("dd", { textContent: fmt(item.target) })]),
      el("div", {}, [el("dt", { textContent: "Relación riesgo-beneficio" }), el("dd", { textContent: `1:${fmt(item.rr)}` })]),
      el("div", {}, [el("dt", { textContent: "RSI 14" }), el("dd", { textContent: item.rsi.toFixed(2).replace(".", ",") })]),
    ]);

    const millions = (item.volume24h / 1e6).toLocaleString("es", { maximumFractionDigits: 1 });
    const tierText = { bajo: "Bajo", medio: "Medio", alto: "Alto" }[item.volTier];
    const volNote = el("p", { className: item.volTier === "bajo" ? "vol-note warn" : "vol-note" }, [
      document.createTextNode(`Volumen 24 h: ${millions} M USD · nivel ${tierText.toLowerCase()}. Riesgo sugerido: ${fmt(item.riskPct)} % del capital.`),
      ...(item.volTier === "bajo" ? [document.createElement("br"), document.createTextNode("Liquidez limitada: el deslizamiento puede ser mayor que el stop calculado.")] : []),
    ]);

    container.append(el("article", { className: "row" }, [
      el("div", { className: "row-head" }, [
        el("h3", {}, [el("a", {
          className: "symbol",
          href: `https://www.tradingview.com/chart/?symbol=${encodeURIComponent(`BINANCE:${item.symbol}.P`)}&interval=240`,
          target: "_blank",
          rel: "noopener noreferrer",
          textContent: item.symbol,
          title: "Abrir la gráfica de 4 horas en TradingView",
        })]),
        button,
      ]),
      levels,
      volNote,
      checksList,
    ]));
  }
}

const scanBtn = document.getElementById("scan-btn");
const statusEl = document.getElementById("status");
const autoBox = document.getElementById("auto");
let running = false;
let timer = null;
const velas = document.querySelector(".velas");
const ctx = velas.getContext("2d");
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

// Niveles de tamaño de vela: bajo, medio y alto (fracción del precio)
const NIVELES = [0.012, 0.035, 0.08];
const STEP = 16;           // separación horizontal entre velas (px)
const SPEED = 24;          // velocidad de desplazamiento (px por segundo)
const UP = "#1F3B33";      // alcista
const DOWN = "#A4502E";    // bajista
let velasData = [];
let offset = 0;
let rafId = null;
let lastT = 0;

function nuevaVela(prevClose) {
  const nivel = NIVELES[Math.floor(Math.random() * NIVELES.length)];
  // Sesgo suave hacia el centro para que el gráfico no se aleje demasiado
  const pSube = prevClose < 100 ? 0.6 : 0.4;
  const dir = Math.random() < pSube ? 1 : -1;
  const o = prevClose;
  const c = o * (1 + dir * nivel * (0.5 + Math.random()));
  const mecha = nivel * (0.3 + Math.random());
  const h = Math.max(o, c) * (1 + mecha * Math.random());
  const l = Math.min(o, c) * (1 - mecha * Math.random());
  return { o, c, h, l };
}

function resize() {
  const dpr = window.devicePixelRatio || 1;
  velas.width = Math.round(velas.clientWidth * dpr);
  velas.height = Math.round(velas.clientHeight * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // Suficientes velas para cubrir todo el ancho
  const needed = Math.ceil(velas.clientWidth / STEP) + 3;
  while (velasData.length < needed) {
    const prev = velasData.length ? velasData[velasData.length - 1].c : 100;
    velasData.push(nuevaVela(prev));
  }
}

function draw() {
  const w = velas.clientWidth, h = velas.clientHeight;
  ctx.clearRect(0, 0, w, h);
  const minP = Math.min(...velasData.map((v) => v.l));
  const maxP = Math.max(...velasData.map((v) => v.h));
  const pad = 8;
  const y = (p) => pad + ((maxP - p) / (maxP - minP)) * (h - 2 * pad);
  for (let i = 0; i < velasData.length; i++) {
    const v = velasData[i];
    const x = i * STEP - offset + STEP / 2;
    if (x < -STEP || x > w + STEP) continue;
    const color = v.c >= v.o ? UP : DOWN;
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(x, y(v.h));
    ctx.lineTo(x, y(v.l));
    ctx.stroke();
    const top = y(Math.max(v.o, v.c));
    const bottom = y(Math.min(v.o, v.c));
    ctx.fillRect(x - 4, top, 8, Math.max(bottom - top, 2));
  }
}

function advance(dt) {
  offset += SPEED * dt;
  while (offset >= STEP) {
    velasData.shift();
    velasData.push(nuevaVela(velasData[velasData.length - 1].c));
    offset -= STEP;
  }
}

function frame(t) {
  const dt = lastT ? Math.min((t - lastT) / 1000, 0.1) : 0;
  lastT = t;
  advance(dt);
  draw();
  rafId = requestAnimationFrame(frame);
}

// Se mueve solo mientras el escáner trabaja; en reposo queda fija
function setWaves(moving) {
  if (moving && !reduceMotion) {
    if (!rafId) {
      lastT = 0;
      rafId = requestAnimationFrame(frame);
    }
  } else {
    if (rafId) {
      cancelAnimationFrame(rafId);
      rafId = null;
    }
    draw();
  }
}

resize();
draw();
window.addEventListener("resize", () => { resize(); draw(); });

function setStatus(text, isError = false) {
  statusEl.textContent = text;
  statusEl.classList.toggle("error", isError);
}

function friendlyError(err) {
  if (err instanceof TypeError) {
    return "No se pudo conectar con Binance desde esta página. Revisa tu conexión o si tu red o navegador bloquean la solicitud.";
  }
  return `Binance respondió con error: ${err.message}`;
}

async function runScan() {
  if (running) return;
  running = true;
  scanBtn.disabled = true;
  setWaves(true);
  setStatus("Consultando Binance…");
  try {
    currentActive = RSI_SET;
    const result = await scan((d, t, s) => setStatus(`Revisando ${s}: ${d} de ${t}`), currentActive);
    render(result);
    const note = result.errors.length ? ` · ${result.errors.length} con error` : "";
    setStatus(`Actualizado a las ${result.generatedAt.toLocaleTimeString("es")}${note}`);
  } catch (err) {
    setStatus(friendlyError(err), true);
  } finally {
    running = false;
    scanBtn.disabled = false;
    setWaves(false);
  }
}

function syncAutoRefresh() {
  clearInterval(timer);
  if (autoBox.checked) timer = setInterval(runScan, AUTO_REFRESH_MS);
}

scanBtn.addEventListener("click", runScan);
autoBox.addEventListener("change", syncAutoRefresh);

setWaves(false);
syncAutoRefresh();
runScan();
</script>
</body>
</html>
